# Perfetto trace config for SmartAAOS app startup on AAOS.
#
# Capture with:
#   adb shell perfetto --txt -c - -o /data/misc/perfetto-traces/trace.pftrace \
#       < tools/perfetto-startup.cfg
#
# Then open the pulled file at https://ui.perfetto.dev
#
# What each data source gives you, and why it is here:
#
#   linux.ftrace + sched/*   which thread was on which CPU, and when it was
#                            blocked. This is what logcat can never tell you.
#   android.log              logcat lines placed on the same timeline, so a
#                            log message can be lined up against a stall.
#   track_event / atrace     the named slices apps and the framework emit
#                            (Choreographer frames, binder transactions,
#                            activity start). The readable layer.
#   linux.process_stats      per-process CPU and memory sampling.
#
# The atrace categories are the part that matters for automotive:
#   binder_driver / binder_lock  cross-process calls. In AAOS almost
#                                everything interesting is another process -
#                                CarService, the VHAL, the templates host - so
#                                app latency is usually binder latency.
#   am / wm / view / gfx         activity start, window, frame rendering.
#   dalvik                       GC pauses, a classic cause of dropped frames.
#   power / freq                 CPU frequency; an emulator lies about this,
#                                real hardware does not.

buffers {
  size_kb: 131072
  fill_policy: RING_BUFFER
}

# 1. Scheduling: who ran when, who was blocked.
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "sched/sched_process_free"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"

      # atrace categories - the human-readable slices
      atrace_categories: "binder_driver"
      atrace_categories: "binder_lock"
      atrace_categories: "am"
      atrace_categories: "wm"
      atrace_categories: "view"
      atrace_categories: "gfx"
      atrace_categories: "dalvik"
      atrace_categories: "aidl"
      atrace_categories: "pm"
      atrace_categories: "ss"

      # our app plus the processes it depends on
      atrace_apps: "com.swapnil.smart.aaos"
      atrace_apps: "com.android.car"
      atrace_apps: "com.google.android.apps.automotive.templates.host"
    }
  }
}

# 2. Process names and CPU/memory, so threads are not just numbers.
data_sources {
  config {
    name: "linux.process_stats"
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 1000
    }
  }
}

# 3. Logcat on the same timeline as the scheduling data.
data_sources {
  config {
    name: "android.log"
    android_log_config {
      min_prio: PRIO_DEBUG
    }
  }
}

# 4. App and framework track events.
data_sources {
  config {
    name: "track_event"
  }
}

duration_ms: 20000
